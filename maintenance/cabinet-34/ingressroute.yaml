apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: funhouse-room-room4
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`riddler.nkplab.com`) && PathPrefix(`/r/qTS1oIq4vo`)
      kind: Rule
      services:
        - name: funhouse-room-room4
          port: 80
      middlewares:
        - name: funhouse-room-room4-strip
  # Use Traefik entrypoint / default cert store (TLS secret stays in app ns).
  tls: {}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: funhouse-room-room4-strip
spec:
  stripPrefix:
    prefixes:
      - /r/qTS1oIq4vo
